name: Release

# Push a tag such as v0.1.0 to build both downloads and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test the script logic
        shell: powershell
        run: |
          & .\tests\Test-ScriptLogic.ps1
          exit $LASTEXITCODE

      - name: Publish both builds
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $project = 'src\VpnKillSwitch\VpnKillSwitch.csproj'

          # Small build: needs the .NET 10 Desktop Runtime
          dotnet publish $project -c Release -r win-x64 --self-contained false `
            -p:Version=$version -p:DebugType=none -o publish\VpnKillSwitch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Standalone single-file build: needs nothing
          dotnet publish $project -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version -p:DebugType=none -o publish\VpnKillSwitch-standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Compress-Archive -Path publish\VpnKillSwitch\* -DestinationPath VpnKillSwitch.zip
          Compress-Archive -Path publish\VpnKillSwitch-standalone\* -DestinationPath VpnKillSwitch-standalone.zip

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' VpnKillSwitch.zip VpnKillSwitch-standalone.zip `
            --title 'VPN Kill Switch ${{ github.ref_name }}' --generate-notes
